<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResForge Chat</title>
<style>
  /* ── Reset & Base ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f13;
    --surface: #1a1a24;
    --surface-hover: #22222e;
    --border: #2a2a3a;
    --text: #e8e8ed;
    --text-soft: #9494a8;
    --text-muted: #5c5c72;
    --accent: #7c5cff;
    --accent-glow: rgba(124, 92, 255, 0.15);
    --accent-hover: #9b80ff;
    --user-msg: #2d2640;
    --user-msg-border: #3d3470;
    --bot-msg: #1a1a24;
    --bot-msg-border: #2a2a3a;
    --danger: #ff4757;
    --success: #2ed573;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 2px 20px rgba(0,0,0,0.3);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    --mono: "SF Mono", "JetBrains Mono", "Cascadia Code", monospace;
    --transition: 200ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  html { font-size: 15px; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ── Layout ── */
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 860px;
    margin: 0 auto;
    padding: 0 16px;
    position: relative;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-logo {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, var(--accent), #ff6b9d);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    color: #fff;
  }
  .header-title {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .header-sub {
    font-size: 11px;
    color: var(--text-soft);
    font-weight: 400;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-icon {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-soft);
    width: 34px;
    height: 34px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: all var(--transition);
  }
  .btn-icon:hover {
    background: var(--surface-hover);
    color: var(--text);
    border-color: var(--text-muted);
  }
  .btn-icon.active {
    color: var(--accent);
    border-color: var(--accent);
  }

  /* ── Chat Messages ── */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 0;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .msg {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    animation: msgIn 0.3s ease-out;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user { flex-direction: row-reverse; }
  .msg.assistant { flex-direction: row; }

  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
  }
  .msg.user .msg-avatar {
    background: linear-gradient(135deg, var(--accent), #7c3aed);
    color: #fff;
  }
  .msg.assistant .msg-avatar {
    background: linear-gradient(135deg, #2ed573, #7bed9f);
    color: #0f0f13;
  }

  .msg-bubble {
    max-width: 75%;
    padding: 10px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.6;
    word-wrap: break-word;
    position: relative;
  }
  .msg.user .msg-bubble {
    background: var(--user-msg);
    border: 1px solid var(--user-msg-border);
    border-bottom-right-radius: 4px;
    color: #e8e8ed;
  }
  .msg.assistant .msg-bubble {
    background: var(--bot-msg);
    border: 1px solid var(--bot-msg-border);
    border-bottom-left-radius: 4px;
  }

  .msg-time {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 4px;
    text-align: right;
  }
  .msg.user .msg-time { text-align: left; }

  /* ── Markdown within messages ── */
  .msg-bubble p { margin: 4px 0; }
  .msg-bubble p:first-child { margin-top: 0; }
  .msg-bubble p:last-child { margin-bottom: 0; }
  .msg-bubble strong { font-weight: 600; color: #fff; }
  .msg-bubble em { font-style: italic; }
  .msg-bubble code {
    background: rgba(255,255,255,0.06);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 13px;
    color: #ff9ff3;
  }
  .msg-bubble pre {
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    margin: 8px 0;
    overflow-x: auto;
  }
  .msg-bubble pre code {
    background: none;
    padding: 0;
    color: var(--text);
    font-size: 13px;
    line-height: 1.5;
  }
  .msg-bubble ul, .msg-bubble ol {
    padding-left: 20px;
    margin: 6px 0;
  }
  .msg-bubble li { margin: 2px 0; }
  .msg-bubble h1, .msg-bubble h2, .msg-bubble h3, .msg-bubble h4 {
    margin: 10px 0 6px;
    font-weight: 600;
    color: #fff;
  }
  .msg-bubble h1 { font-size: 17px; }
  .msg-bubble h2 { font-size: 16px; }
  .msg-bubble h3 { font-size: 15px; }
  .msg-bubble a { color: var(--accent-hover); text-decoration: none; }
  .msg-bubble a:hover { text-decoration: underline; }
  .msg-bubble blockquote {
    border-left: 3px solid var(--accent);
    padding-left: 12px;
    color: var(--text-soft);
    margin: 8px 0;
  }
  .msg-bubble hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 12px 0;
  }
  .msg-bubble table {
    border-collapse: collapse;
    margin: 8px 0;
    font-size: 13px;
    width: 100%;
  }
  .msg-bubble th, .msg-bubble td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    text-align: left;
  }
  .msg-bubble th {
    background: var(--surface-hover);
    font-weight: 600;
  }

  /* ── Typing Indicator ── */
  .typing {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    animation: msgIn 0.3s ease-out;
  }
  .typing-dots {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 14px 18px;
    background: var(--bot-msg);
    border: 1px solid var(--bot-msg-border);
    border-radius: 16px;
    border-bottom-left-radius: 4px;
  }
  .typing-dots span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: bounce 1.4s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* ── Input Area ── */
  .input-area {
    padding: 12px 0 20px;
    flex-shrink: 0;
    border-top: 1px solid var(--border);
  }
  .input-wrap {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  .input-wrap textarea {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: var(--font);
    resize: none;
    outline: none;
    min-height: 44px;
    max-height: 120px;
    line-height: 1.5;
    transition: border-color var(--transition);
  }
  .input-wrap textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .input-wrap textarea::placeholder {
    color: var(--text-muted);
  }

  .btn-send {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, var(--accent), #7c3aed);
    border: none;
    border-radius: var(--radius);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition);
    flex-shrink: 0;
  }
  .btn-send:hover {
    opacity: 0.9;
    transform: scale(1.03);
    box-shadow: 0 4px 15px var(--accent-glow);
  }
  .btn-send:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }
  .btn-send svg {
    width: 18px;
    height: 18px;
  }

  /* ── Welcome Screen ── */
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
    padding: 40px 20px;
  }
  .welcome-icon {
    width: 72px;
    height: 72px;
    background: linear-gradient(135deg, var(--accent), #ff6b9d);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin-bottom: 20px;
    box-shadow: 0 8px 32px var(--accent-glow);
  }
  .welcome h1 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .welcome p {
    color: var(--text-soft);
    max-width: 360px;
    line-height: 1.6;
    font-size: 14px;
  }
  .welcome-hints {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 24px;
  }
  .welcome-hint {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    color: var(--text-soft);
    cursor: pointer;
    transition: all var(--transition);
  }
  .welcome-hint:hover {
    border-color: var(--accent);
    color: var(--accent-hover);
    background: var(--accent-glow);
  }

  /* ── Error Toast ── */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--danger);
    color: #fff;
    padding: 10px 20px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    z-index: 100;
    animation: toastIn 0.3s ease-out;
    box-shadow: 0 4px 20px rgba(255,71,87,0.3);
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(10px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  /* ── Session Badge（右上角） ── */
  .session-badge {
    display: none;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-soft);
    font-family: var(--mono);
    margin-right: 4px;
  }
  .session-badge.show { display: flex; }
  .session-badge .sk {
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .btn-new-session {
    background: linear-gradient(135deg, var(--accent), #7c3aed);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
    font-family: var(--font);
    white-space: nowrap;
    letter-spacing: 0.3px;
  }
  .btn-new-session:hover {
    opacity: 0.9;
    transform: scale(1.04);
    box-shadow: 0 3px 12px var(--accent-glow);
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .app { padding: 0 12px; }
    .msg-bubble { max-width: 85%; }
    .msg-bubble { font-size: 14px; }
    .welcome h1 { font-size: 19px; }
  }

  /* ── Thinking indicator ── */
  .thinking-badge {
    display: inline-block;
    font-size: 11px;
    color: var(--text-soft);
    background: var(--surface-hover);
    padding: 1px 8px;
    border-radius: 10px;
    margin-top: 4px;
  }
</style>
</head>
<body>
<div class="app" id="app">
  <!-- Header -->
  <header class="header">
    <div class="header-brand">
      <div class="header-logo">R</div>
      <div>
        <div class="header-title">ResForge</div>
        <div class="header-sub">AI Research Assistant</div>
      </div>
    </div>
    <div class="header-actions">
      <div class="session-badge" id="sessionBadge"></div>
      <button class="btn-icon" id="btnClear" title="清空对话" onclick="clearChat()">✕</button>
    </div>
  </header>

  <!-- Messages -->
  <div class="messages" id="messages"></div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="输入消息..." enterkeyhint="send"></textarea>
      <button class="btn-send" id="btnSend" disabled aria-label="发送" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
  // ── Simple Markdown Parser ──
  function renderMarkdown(text) {
    if (!text) return '';
    let html = text
      // Escape HTML first
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      // Code blocks
      .replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
        return `<pre><code>${code.trim()}</code></pre>`;
      })
      // Inline code
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      // Headers
      .replace(/^### (.+)$/gm, '<h3>$1</h3>')
      .replace(/^## (.+)$/gm, '<h2>$1</h2>')
      .replace(/^# (.+)$/gm, '<h1>$1</h1>')
      // Bold & Italic
      .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      // Links
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      // Blockquotes
      .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
      // Horizontal rules
      .replace(/^---$/gm, '<hr>')
      // Unordered lists
      .replace(/^- (.+)$/gm, '<li>$1</li>')
      // Ordered lists
      .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
      // Line breaks (double newline = paragraph)
      .replace(/\n\n/g, '</p><p>')
      // Single line breaks
      .replace(/\n/g, '<br>');

    // Wrap in paragraphs if not already
    if (!html.startsWith('<h') && !html.startsWith('<pre') && !html.startsWith('<blockquote') && !html.startsWith('<hr')) {
      html = '<p>' + html + '</p>';
    }
    // Wrap consecutive <li> in <ul>
    html = html.replace(/((?:<li>.*?<\/li><br>?)+)/g, '<ul>$1</ul>');
    return html;
  }

  // ── State ──
  const state = {
    sessionKey: localStorage.getItem('rf_chat_session') || '',
    messages: [],
    sending: false,
    controller: null,
  };

  // ── DOM refs ──
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const btnSend = document.getElementById('btnSend');
  const sessionBadge = document.getElementById('sessionBadge');

  // ── Auto-resize textarea ──
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    btnSend.disabled = !inputEl.value.trim() || state.sending;
  });

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // ── Send Message ──
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || state.sending) return;

    inputEl.value = '';
    inputEl.style.height = 'auto';
    state.sending = true;
    btnSend.disabled = true;

    // Add user message
    addMessage('user', text);
    showTyping();

    // Hide welcome
    document.querySelector('.welcome')?.remove();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: text,
          session_key: state.sessionKey || undefined,
        }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: `请求失败 (${res.status})` }));
        throw new Error(err.detail || `请求失败 (${res.status})`);
      }

      const data = await res.json();

      // Save session
      if (!state.sessionKey && data.session_key) {
        state.sessionKey = data.session_key;
        localStorage.setItem('rf_chat_session', data.session_key);
        updateSessionBadge();
      }

      // Remove typing indicator
      removeTyping();

      // Add assistant response with typewriter
      addMessage('assistant', data.response, true);

    } catch (err) {
      removeTyping();
      showToast(err.message);
    } finally {
      state.sending = false;
      btnSend.disabled = true;
      inputEl.focus();
    }
  }

  // ── Add Message ──
  function addMessage(role, content, typewriter = false) {
    const now = new Date();
    const time = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.innerHTML = `
      <div class="msg-avatar">${role === 'user' ? 'U' : 'R'}</div>
      <div>
        <div class="msg-bubble" id="msg-${Date.now()}">${typewriter ? '' : renderMarkdown(content)}</div>
        <div class="msg-time">${time}</div>
      </div>
    `;

    messagesEl.appendChild(div);
    scrollToBottom();

    if (typewriter) {
      const bubble = div.querySelector('.msg-bubble');
      typewriterEffect(bubble, content);
    }

    return div;
  }

  // ── Typewriter Effect ──
  function typewriterEffect(el, text) {
    let index = 0;
    const speed = 12; // ms per character - fast and smooth

    function type() {
      if (index < text.length) {
        const chunk = text.slice(0, index + 1);
        el.innerHTML = renderMarkdown(chunk);
        // Add a cursor during typing
        if (index < text.length - 1) {
          el.innerHTML += '<span class="typing-cursor" style="animation: blink 0.8s infinite; display: inline-block; width: 2px; height: 14px; background: var(--accent); margin-left: 2px; vertical-align: middle;"></span>';
        }
        index += 5; // characters per step for speed
        scrollToBottom();
        requestAnimationFrame(() => setTimeout(type, speed));
      } else {
        el.innerHTML = renderMarkdown(text);
        scrollToBottom();
      }
    }
    type();
  }

  // Add blink keyframes
  const style = document.createElement('style');
  style.textContent = `
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  `;
  document.head.appendChild(style);

  // ── Typing Indicator ──
  function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typingIndicator';
    div.innerHTML = `
      <div class="msg-avatar" style="background: linear-gradient(135deg, #2ed573, #7bed9f); color: #0f0f13;">R</div>
      <div class="typing-dots"><span></span><span></span><span></span></div>
    `;
    messagesEl.appendChild(div);
    scrollToBottom();
  }

  function removeTyping() {
    document.getElementById('typingIndicator')?.remove();
  }

  // ── Scroll ──
  function scrollToBottom() {
    requestAnimationFrame(() => {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  }

  // ── Toast ──
  function showToast(msg) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();

    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 4000);
  }

  // ── Clear Chat ──
  function clearChat() {
    messagesEl.innerHTML = '';
    showWelcome();
  }

  // ── Session Badge ──
  function updateSessionBadge() {
    if (state.sessionKey) {
      sessionBadge.className = 'session-badge show';
      sessionBadge.innerHTML = `<span class="sk">${state.sessionKey}</span><button class="btn-new-session" onclick="resetSession()">＋ 新会话</button>`;
    } else {
      sessionBadge.className = 'session-badge';
    }
  }

  function resetSession() {
    state.sessionKey = '';
    localStorage.removeItem('rf_chat_session');
    sessionBadge.className = 'session-badge';
    clearChat();
  }

  // ── Welcome Screen ──
  function showWelcome() {
    const existing = document.querySelector('.welcome');
    if (existing) return;

    const div = document.createElement('div');
    div.className = 'welcome';
    div.innerHTML = `
      <div class="welcome-icon">✦</div>
      <h1>开始对话</h1>
      <p>我是 ResForge AI 研究助手，可以帮你回答问题、搜索信息、分析数据。</p>
      <div class="welcome-hints">
        <span class="welcome-hint" onclick="quickQuestion('你好，介绍一下你自己')">👋 自我介绍</span>
        <span class="welcome-hint" onclick="quickQuestion('搜索量子计算的最新进展')">🔬 搜索话题</span>
        <span class="welcome-hint" onclick="quickQuestion('帮我想几个创业点子')">💡 创意头脑风暴</span>
      </div>
    `;
    messagesEl.appendChild(div);
  }

  function quickQuestion(text) {
    inputEl.value = text;
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    sendMessage();
  }

  // ── Init ──
  updateSessionBadge();
  if (!state.sessionKey) {
    showWelcome();
  } else {
    // Optionally load previous messages or just start fresh
    addMessage('assistant', '会话已恢复，有什么我可以帮你的？');
  }
  inputEl.focus();

  // Auto-resize on init
  btnSend.disabled = true;
</script>
</body>
</html>
